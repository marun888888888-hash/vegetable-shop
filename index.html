<div class="grid">
    <div class="card">
        <h3>Thakkali</h3><p>₹40 /kg</p>
        <input type="number" id="qty-Thakkali" value="1" min="1" style="width: 40px;"> kg
        <button class="btn" onclick="add('Thakkali', document.getElementById('qty-Thakkali').value)">Serkavum</button>
    </div>
    <div class="card">

    </div>
    <div class="card">
        <h3>Ulli</h3><p>₹80 /kg</p>

<script>
    let cart = [];
    function add(item, qty) {
        cart.push(item + " (" + qty + " kg)");
        alert(item + " " + qty + " kg serkathapattathu!");
        document.getElementById('orderLink').style.display = 'block';
        document.getElementById('orderLink').href = "https://wa.me/919894963170?text=Enakku intha kaaykarigal vendum: " + cart.join(", ");
    }
</script>
