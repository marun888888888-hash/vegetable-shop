<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>அருண் காய்கறி கடை</title>
    <style>
        body { font-family: sans-serif; background: #eefbff; padding: 10px; margin: 0; }
        h2 { text-align: center; font-size: 28px; color: #0056b3; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .card { background: white; padding: 15px; border-radius: 15px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card img { width: 100%; height: 150px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; }
        .card h3 { margin: 10px 0; font-size: 20px; }
        .card p { font-size: 16px; color: #555; }
        .btn { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        input[type="number"] { padding: 8px; width: 50px; border: 1px solid #ccc; border-radius: 5px; text-align: center; }
        
        /* முகவரி பெட்டிக்கான ஸ்டைல் */
        #address { width: 100%; padding: 12px; margin-top: 20px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        
        #orderLink { display: none; margin-top: 20px; padding: 15px; background: #25D366; color: white; text-align: center; border-radius: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🛒 அருண் காய்கறி கடை</h2>

    <div class="grid">
        <div class="card">
            <img src="thakkali.jpg" alt="தக்காளி">
            <h3>தக்காளி</h3><p>₹40 /kg</p>
            <input type="number" id="qty-Thakkali" value="1" min="1"> kg
            <button class="btn" onclick="add('தக்காளி', document.getElementById('qty-Thakkali').value)">சேர்க்கவும்</button>
        </div>
        <div class="card">
            <img src="potato.jpg" alt="உருளைக்கிழங்கு">
            <h3>உருளைக்கிழங்கு</h3><p>₹30 /kg</p>
            <input type="number" id="qty-Urulaikilangu" value="1" min="1"> kg
            <button class="btn" onclick="add('உருளைக்கிழங்கு', document.getElementById('qty-Urulaikilangu').value)">சேர்க்கவும்</button>
        </div>
        <div class="card">
            <img src="small onion.jpg" alt="உள்ளி">
            <h3>உள்ளி</h3><p>₹80 /kg</p>
            <input type="number" id="qty-Ulli" value="1" min="1"> kg
            <button class="btn" onclick="add('உள்ளி', document.getElementById('qty-Ulli').value)">சேர்க்கவும்</button>
        </div>
        <div class="card">
            <img src="onion.jpg" alt="பல்லாரி">
            <h3>பல்லாரி</h3><p>₹50 /kg</p>
            <input type="number" id="qty-Pallari" value="1" min="1"> kg
            <button class="btn" onclick="add('பல்லாரி', document.getElementById('qty-Pallari').value)">சேர்க்கவும்</button>
        </div>
    </div>

    <input type="text" id="address" placeholder="உங்கள் முகவரியை இங்கே உள்ளிடவும்">

    <a id="orderLink" href="#" onclick="updateLink()">WhatsApp-ல் ஆர்டர் அனுப்பவும்</a>

    <script>
        let cart = [];
        function add(item, qty) {
            cart.push(item + " (" + qty + " kg)");
            alert(item + " " + qty + " kg சேர்க்கப்பட்டது!");
            document.getElementById('orderLink').style.display = 'block';
            updateLink();
        }

        function updateLink() {
            let userAddress = document.getElementById('address').value;
            let message = "வணக்கம், அருண் காய்கறி கடையிலிருந்து ஆர்டர் செய்ய விரும்புகிறேன்:%0A%0A" + 
                          "தேவையானவை: " + cart.join(", ") + "%0A" +
                          "முகவரி: " + (userAddress ? userAddress : "குறிப்பிடவில்லை") + "%0A%0A" +
                          "தயவுசெய்து விரைவில் டெலிவரி செய்யவும்!";
            
            document.getElementById('orderLink').href = "https://wa.me/919894963170?text=" + message;
        }
    </script>
</body>
</html>
